<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>卓仪科技 Joymem Tech. — Logo</title>
<style>
  :root {
    --bg: #0a0e17;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 32px; background: var(--bg);
    font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 48px 64px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .label { color: #8899aa; font-size: 13px; letter-spacing: .15em; text-align: center; margin-top: 8px; }
  .variants {
    display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start;
  }
  .variant-card {
    background: #141a24; border-radius: 20px; padding: 40px 48px;
    border: 1px solid rgba(255,255,255,.06);
  }
  .variant-label { color: #5a6a7a; font-size: 12px; text-align: center; margin-top: 16px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>

<!-- Primary Logo: Horizontal layout -->
<div class="card">
  <svg width="520" height="160" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gChip" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00d4aa"/>
        <stop offset="100%" stop-color="#0088cc"/>
      </linearGradient>
      <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00d4aa"/>
        <stop offset="100%" stop-color="#0066aa"/>
      </linearGradient>
      <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00d4aa"/>
        <stop offset="100%" stop-color="#0099dd"/>
      </linearGradient>
      <!-- Glow filter -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- Icon: Chip + circular-arrow + test-probe mark -->
    <g transform="translate(75,80)">
      <!-- Outer ring (recycling / circular economy) -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="url(#gRing)" stroke-width="3" stroke-dasharray="280 44" stroke-linecap="round" transform="rotate(-95)"/>

      <!-- Inner ring segment (measurement / precision) -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="url(#gRing)" stroke-width="1.5" stroke-dasharray="100 176" stroke-linecap="round" transform="rotate(-65)" opacity="0.6"/>

      <!-- Chip body (central square = memory chip) -->
      <rect x="-24" y="-24" width="48" height="48" rx="6" fill="none" stroke="url(#gChip)" stroke-width="2.5"/>
      <!-- Inner die -->
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="url(#gChip)" opacity="0.85"/>

      <!-- Chip pins (left & right) — 4 per side -->
      <g stroke="url(#gChip)" stroke-width="1.6" stroke-linecap="round">
        <line x1="-24" y1="-15" x2="-31" y2="-15"/>
        <line x1="-24" y1="-5"  x2="-31" y2="-5"/>
        <line x1="-24" y1="5"   x2="-31" y2="5"/>
        <line x1="-24" y1="15"  x2="-31" y2="15"/>
        <line x1="24" y1="-15" x2="31" y2="-15"/>
        <line x1="24" y1="-5"  x2="31" y2="-5"/>
        <line x1="24" y1="5"   x2="31" y2="5"/>
        <line x1="24" y1="15"  x2="31" y2="15"/>
      </g>

      <!-- Top/bottom pins -->
      <g stroke="url(#gChip)" stroke-width="1.6" stroke-linecap="round">
        <line x1="-15" y1="-24" x2="-15" y2="-31"/>
        <line x1="-5"  y1="-24" x2="-5"  y2="-31"/>
        <line x1="5"   y1="-24" x2="5"   y2="-31"/>
        <line x1="15"  y1="-24" x2="15"  y2="-31"/>
        <line x1="-15" y1="24"  x2="-15" y2="31"/>
        <line x1="-5"  y1="24"  x2="-5"  y2="31"/>
        <line x1="5"   y1="24"  x2="5"   y2="31"/>
        <line x1="15"  y1="24"  x2="15"  y2="31"/>
      </g>

      <!-- Test probe accent (top-left, like an oscilloscope probe touching the chip) -->
      <g stroke="#00d4aa" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -38,-38 L -28,-24" stroke-width="2"/>
        <circle cx="-38" cy="-40" r="3" fill="#00d4aa" stroke="none" opacity="0.8"/>
      </g>

      <!-- Small data dots (testing / grading nodes) -->
      <circle cx="0" cy="-36" r="2.5" fill="#00d4aa" opacity="0.7"/>
      <circle cx="34" cy="-20" r="2" fill="#00d4aa" opacity="0.5"/>
      <circle cx="-34" cy="20" r="2" fill="#00d4aa" opacity="0.5"/>
    </g>

    <!-- Company name: 卓仪科技 -->
    <text x="165" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="36" font-weight="700" fill="#1a2a3a" letter-spacing="4">卓仪科技</text>

    <!-- English name -->
    <text x="168" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="500" fill="#5a7a8a" letter-spacing="3">JOYMEM TECH.</text>

    <!-- Tagline -->
    <text x="168" y="122" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#889aaa" letter-spacing="2">存储芯片测试 · 循环增值</text>

    <!-- Subtle horizontal rule between name and tagline -->
    <line x1="165" y1="106" x2="390" y2="106" stroke="#dde6ec" stroke-width="0.8"/>
  </svg>
  <div class="label">主标识 · 横式</div>
</div>

<!-- Variants -->
<div class="variants">
  <!-- Icon only (app icon / favicon) -->
  <div class="variant-card">
    <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00d4aa"/>
          <stop offset="100%" stop-color="#0088cc"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r="48" fill="none" stroke="url(#g2)" stroke-width="3" stroke-dasharray="260 40" stroke-linecap="round" transform="rotate(-95,60,60)"/>
      <circle cx="60" cy="60" r="40" fill="none" stroke="url(#g2)" stroke-width="1.2" stroke-dasharray="90 160" stroke-linecap="round" transform="rotate(-65,60,60)" opacity="0.55"/>
      <rect x="36" y="36" width="48" height="48" rx="6" fill="none" stroke="url(#g2)" stroke-width="2.8"/>
      <rect x="47" y="47" width="26" height="26" rx="3.5" fill="url(#g2)" opacity="0.9"/>
      <!-- Pins -->
      <g stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round">
        <line x1="36" y1="44" x2="28" y2="44"/><line x1="36" y1="54" x2="28" y2="54"/>
        <line x1="36" y1="64" x2="28" y2="64"/><line x1="36" y1="74" x2="28" y2="74"/>
        <line x1="84" y1="44" x2="92" y2="44"/><line x1="84" y1="54" x2="92" y2="54"/>
        <line x1="84" y1="64" x2="92" y2="64"/><line x1="84" y1="74" x2="92" y2="74"/>
        <line x1="44" y1="36" x2="44" y2="28"/><line x1="54" y1="36" x2="54" y2="28"/>
        <line x1="64" y1="36" x2="64" y2="28"/><line x1="74" y1="36" x2="74" y2="28"/>
        <line x1="44" y1="84" x2="44" y2="92"/><line x1="54" y1="84" x2="54" y2="92"/>
        <line x1="64" y1="84" x2="64" y2="92"/><line x1="74" y1="84" x2="74" y2="92"/>
      </g>
      <!-- Probe dot -->
      <circle cx="22" cy="20" r="4" fill="#00d4aa" opacity="0.85"/>
      <path d="M 24,22 L 34,32" stroke="#00d4aa" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="variant-label">应用图标</div>
  </div>

  <!-- Vertical layout -->
  <div class="variant-card">
    <svg width="160" height="240" viewBox="0 0 160 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00d4aa"/>
          <stop offset="100%" stop-color="#0088cc"/>
        </linearGradient>
      </defs>
      <g transform="translate(80,72)">
        <circle cx="0" cy="0" r="46" fill="none" stroke="url(#g3)" stroke-width="2.8" stroke-dasharray="250 38" stroke-linecap="round" transform="rotate(-95)"/>
        <circle cx="0" cy="0" r="38" fill="none" stroke="url(#g3)" stroke-width="1.2" stroke-dasharray="86 152" stroke-linecap="round" transform="rotate(-65)" opacity="0.55"/>
        <rect x="-22" y="-22" width="44" height="44" rx="5.5" fill="none" stroke="url(#g3)" stroke-width="2.4"/>
        <rect x="-10.5" y="-10.5" width="21" height="21" rx="3" fill="url(#g3)" opacity="0.85"/>
        <g stroke="url(#g3)" stroke-width="1.5" stroke-linecap="round">
          <line x1="-22" y1="-13" x2="-29" y2="-13"/><line x1="-22" y1="-4" x2="-29" y2="-4"/>
          <line x1="-22" y1="5" x2="-29" y2="5"/><line x1="-22" y1="14" x2="-29" y2="14"/>
          <line x1="22" y1="-13" x2="29" y2="-13"/><line x1="22" y1="-4" x2="29" y2="-4"/>
          <line x1="22" y1="5" x2="29" y2="5"/><line x1="22" y1="14" x2="29" y2="14"/>
          <line x1="-13" y1="-22" x2="-13" y2="-29"/><line x1="-4" y1="-22" x2="-4" y2="-29"/>
          <line x1="5" y1="-22" x2="5" y2="-29"/><line x1="14" y1="-22" x2="14" y2="-29"/>
          <line x1="-13" y1="22" x2="-13" y2="29"/><line x1="-4" y1="22" x2="-4" y2="29"/>
          <line x1="5" y1="22" x2="5" y2="29"/><line x1="14" y1="22" x2="14" y2="29"/>
        </g>
        <path d="M -34,-34 L -24,-22" stroke="#00d4aa" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <circle cx="-35" cy="-36" r="3" fill="#00d4aa" opacity="0.8"/>
      </g>
      <text x="80" y="148" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#e8f0f6" letter-spacing="6">卓仪科技</text>
      <text x="80" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#6a8a9a" letter-spacing="4">JOYMEM TECH.</text>
      <line x1="40" y1="180" x2="120" y2="180" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
      <text x="80" y="196" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#6a7a8a" letter-spacing="2">存储芯片测试 · 循环增值</text>
    </svg>
    <div class="variant-label">竖式</div>
  </div>

  <!-- Dark mode (icon on brand bg) -->
  <div class="variant-card">
    <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="120" rx="28" fill="#0c1420"/>
      <defs>
        <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00e4b8"/>
          <stop offset="100%" stop-color="#0099ee"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="56" r="38" fill="none" stroke="url(#g4)" stroke-width="2.6" stroke-dasharray="210 32" stroke-linecap="round" transform="rotate(-95,60,56)"/>
      <circle cx="60" cy="56" r="30" fill="none" stroke="url(#g4)" stroke-width="1" stroke-dasharray="64 124" stroke-linecap="round" transform="rotate(-65,60,56)" opacity="0.45"/>
      <rect x="42" y="38" width="36" height="36" rx="5" fill="none" stroke="url(#g4)" stroke-width="2.2"/>
      <rect x="50.5" y="46.5" width="19" height="19" rx="2.8" fill="url(#g4)" opacity="0.88"/>
      <g stroke="url(#g4)" stroke-width="1.4" stroke-linecap="round">
        <line x1="42" y1="46" x2="35" y2="46"/><line x1="42" y1="54" x2="35" y2="54"/>
        <line x1="42" y1="62" x2="35" y2="62"/><line x1="42" y1="70" x2="35" y2="70"/>
        <line x1="78" y1="46" x2="85" y2="46"/><line x1="78" y1="54" x2="85" y2="54"/>
        <line x1="78" y1="62" x2="85" y2="62"/><line x1="78" y1="70" x2="85" y2="70"/>
        <line x1="46" y1="38" x2="46" y2="31"/><line x1="54" y1="38" x2="54" y2="31"/>
        <line x1="62" y1="38" x2="62" y2="31"/><line x1="70" y1="38" x2="70" y2="31"/>
        <line x1="46" y1="78" x2="46" y2="85"/><line x1="54" y1="78" x2="54" y2="85"/>
        <line x1="62" y1="78" x2="62" y2="85"/><line x1="70" y1="78" x2="70" y2="85"/>
      </g>
      <circle cx="32" cy="22" r="3.2" fill="#00e4b8"/>
      <path d="M 34,24 L 41,31" stroke="#00e4b8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- Small data dots around -->
      <circle cx="60" cy="22" r="2" fill="#00e4b8" opacity="0.5"/>
      <circle cx="86" cy="36" r="1.8" fill="#00e4b8" opacity="0.35"/>
      <circle cx="28" cy="70" r="1.8" fill="#00e4b8" opacity="0.35"/>
    </svg>
    <div class="variant-label">深色底</div>
  </div>
</div>

</body>
</html>
